[project]
name = "dismisstress"
version = "0.1.1"
description = "TUI manager for GitHub notifications"
requires-python = ">=3.11"
dependencies = ["aiohttp>=3,<4", "textual"]
readme = "README.md"

[project.scripts]
dismisstress = "dismisstress:main"

[project.urls]
homepage = "https://github.com/sirosen/jigs"
source = "https://github.com/sirosen/jigs/tree/main/python/dismisstress"

# -- build config (hatch/hatchling)
 
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
exclude = ["uv.lock"]
[tool.hatch.build.targets.sdist]
exclude = ["uv.lock"]

# -- hatch envs

[tool.hatch.envs.mypy]
dependencies = ["mypy"]
[tool.hatch.envs.mypy.scripts]
main = "mypy {args}"

[tool.hatch.envs.check-sdist]
dependencies = ["check-sdist"]
[tool.hatch.envs.check-sdist.scripts]
main = "check-sdist --inject-junk"

# -- tool configs

[tool.mypy]
strict = true
files = ["src"]
